<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif">
  <defs>
    <style>
      .title { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; font-weight: 600; }
      .subtitle { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; font-style: italic; }
      .body { font-family: 'Inter', 'Helvetica Neue', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .label { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>

    <filter id="card-shadow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2332"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6b6b"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a64d3e"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#faf8f3"/>

  <!-- Top border -->
  <line x1="60" y1="40" x2="1340" y2="40" stroke="#c9a961" stroke-width="0.5"/>
  <line x1="60" y1="44" x2="1340" y2="44" stroke="#c9a961" stroke-width="0.5"/>

  <!-- Header -->
  <text x="60" y="90" class="label" font-size="11" fill="#c9a961" letter-spacing="0.2em">FIGURE 2 · INVOCATION LOGIC</text>
  <text x="60" y="135" class="title" font-size="42" fill="#1a2332">When the Council fires</text>
  <text x="60" y="170" class="subtitle" font-size="20" fill="#3a6b6b">Triage discipline distinguishes deliberation from default chat</text>

  <text x="1340" y="90" class="label" font-size="10" fill="#1a2332" text-anchor="end" letter-spacing="0.15em">VERSION 1.2 · HERMES EDITION</text>
  <text x="1340" y="108" class="body" font-size="11" fill="#1a2332" text-anchor="end" font-style="italic">Thinking Council · 2026</text>

  <!-- ============================================================ -->
  <!-- ENTRY: USER PROMPT -->
  <!-- ============================================================ -->

  <g transform="translate(540, 220)">
    <rect x="0" y="0" width="320" height="70" fill="#ffffff" stroke="#1a2332" stroke-width="1.5" filter="url(#card-shadow-2)"/>
    <text x="160" y="25" class="label" font-size="9" fill="#1a2332" text-anchor="middle">ENTRY</text>
    <line x1="40" y1="33" x2="280" y2="33" stroke="#c9a961" stroke-width="0.5"/>
    <text x="160" y="55" class="title" font-size="18" fill="#1a2332" text-anchor="middle">User sends a prompt</text>
  </g>

  <line x1="700" y1="295" x2="700" y2="335" stroke="#1a2332" stroke-width="1.5" marker-end="url(#arrow-2)"/>

  <!-- ============================================================ -->
  <!-- DECISION 1: Trigger phrase present? -->
  <!-- ============================================================ -->

  <g transform="translate(530, 340)">
    <polygon points="170,0 340,55 170,110 0,55" fill="#1a2332" filter="url(#card-shadow-2)"/>
    <text x="170" y="48" class="label" font-size="9" fill="#c9a961" text-anchor="middle">DECISION POINT</text>
    <text x="170" y="72" class="title" font-size="15" fill="#faf8f3" text-anchor="middle">Trigger phrase used?</text>
    <text x="170" y="90" class="body" font-size="10" fill="#a3b8c8" text-anchor="middle" font-style="italic">"convene the council" · "council this" · etc.</text>
  </g>

  <!-- YES branch -->
  <text x="900" y="395" class="label" font-size="11" fill="#c9a961" letter-spacing="0.15em">YES</text>
  <line x1="870" y1="395" x2="980" y2="395" stroke="#1a2332" stroke-width="1.5" marker-end="url(#arrow-2)"/>

  <!-- NO branch (downward) -->
  <text x="685" y="475" class="label" font-size="11" fill="#3a6b6b" letter-spacing="0.15em">NO</text>
  <line x1="700" y1="450" x2="700" y2="495" stroke="#3a6b6b" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- ============================================================ -->
  <!-- BRANCH A: Trigger present → CONVENE -->
  <!-- ============================================================ -->

  <g transform="translate(990, 360)">
    <rect x="0" y="0" width="280" height="75" fill="#3a6b6b" filter="url(#card-shadow-2)"/>
    <rect x="0" y="0" width="280" height="6" fill="#c9a961"/>
    <text x="140" y="32" class="label" font-size="9" fill="#c9a961" text-anchor="middle">CHAIRMAN TRIAGE</text>
    <text x="140" y="55" class="title" font-size="16" fill="#faf8f3" text-anchor="middle">Convene the panel</text>
  </g>

  <!-- ============================================================ -->
  <!-- BRANCH B: No trigger → assess high-stakes signals -->
  <!-- ============================================================ -->

  <g transform="translate(530, 500)">
    <polygon points="170,0 340,55 170,110 0,55" fill="#1a2332" filter="url(#card-shadow-2)"/>
    <text x="170" y="48" class="label" font-size="9" fill="#c9a961" text-anchor="middle">DECISION POINT</text>
    <text x="170" y="72" class="title" font-size="15" fill="#faf8f3" text-anchor="middle">High-stakes signals?</text>
    <text x="170" y="90" class="body" font-size="10" fill="#a3b8c8" text-anchor="middle" font-style="italic">strategic · multi-domain · contested</text>
  </g>

  <!-- YES branch from D2 -->
  <text x="900" y="555" class="label" font-size="11" fill="#c9a961" letter-spacing="0.15em">YES</text>
  <line x1="870" y1="555" x2="980" y2="555" stroke="#1a2332" stroke-width="1.5" marker-end="url(#arrow-2)"/>

  <g transform="translate(990, 520)">
    <rect x="0" y="0" width="280" height="75" fill="#ffffff" stroke="#1a2332" stroke-width="1.5" filter="url(#card-shadow-2)"/>
    <rect x="0" y="0" width="6" height="75" fill="#c9a961"/>
    <text x="140" y="30" class="label" font-size="9" fill="#c9a961" text-anchor="middle">BORDERLINE PROMPT</text>
    <text x="140" y="55" class="title" font-size="15" fill="#1a2332" text-anchor="middle">Ask user to confirm</text>
  </g>

  <!-- NO branch from D2 (down) -->
  <text x="685" y="635" class="label" font-size="11" fill="#3a6b6b" letter-spacing="0.15em">NO</text>
  <line x1="700" y1="610" x2="700" y2="660" stroke="#3a6b6b" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- ============================================================ -->
  <!-- DEFAULT: Single-pass response -->
  <!-- ============================================================ -->

  <g transform="translate(540, 665)">
    <rect x="0" y="0" width="320" height="70" fill="#ffffff" stroke="#3a6b6b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="160" y="25" class="label" font-size="9" fill="#3a6b6b" text-anchor="middle">DEFAULT PATH</text>
    <line x1="40" y1="33" x2="280" y2="33" stroke="#3a6b6b" stroke-width="0.3"/>
    <text x="160" y="55" class="title" font-size="16" fill="#1a2332" text-anchor="middle">Single-model response</text>
  </g>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: When NOT to invoke (cautionary list) -->
  <!-- ============================================================ -->

  <g transform="translate(80, 780)">
    <rect x="0" y="0" width="600" height="160" fill="#faf8f3" stroke="#a64d3e" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="160" fill="#a64d3e"/>
    <text x="20" y="28" class="label" font-size="10" fill="#a64d3e" letter-spacing="0.15em">DO NOT INVOKE WHEN</text>
    <line x1="20" y1="38" x2="200" y2="38" stroke="#a64d3e" stroke-width="0.5"/>

    <text x="20" y="62" class="body" font-size="12" fill="#1a2332">— Question is factual or procedural; has known correct answer</text>
    <text x="20" y="82" class="body" font-size="12" fill="#1a2332">— Casual conversation or quick exploration</text>
    <text x="20" y="102" class="body" font-size="12" fill="#1a2332">— Single-domain technical work one model would handle well</text>
    <text x="20" y="122" class="body" font-size="12" fill="#1a2332">— Iteration speed matters more than thoroughness</text>
    <text x="20" y="142" class="body" font-size="12" fill="#1a2332">— You'd accept a single-model answer if it sounded confident</text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: When TO invoke (positive list) -->
  <!-- ============================================================ -->

  <g transform="translate(720, 780)">
    <rect x="0" y="0" width="600" height="160" fill="#faf8f3" stroke="#c9a961" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="160" fill="#c9a961"/>
    <text x="20" y="28" class="label" font-size="10" fill="#c9a961" letter-spacing="0.15em">INVOKE WHEN</text>
    <line x1="20" y1="38" x2="170" y2="38" stroke="#c9a961" stroke-width="0.5"/>

    <text x="20" y="62" class="body" font-size="12" fill="#1a2332">— Strategic or multi-domain question with real stakes</text>
    <text x="20" y="82" class="body" font-size="12" fill="#1a2332">— Contested question where models likely disagree</text>
    <text x="20" y="102" class="body" font-size="12" fill="#1a2332">— Single-model answer would be confidently wrong in undetectable ways</text>
    <text x="20" y="122" class="body" font-size="12" fill="#1a2332">— Cost of bad answer ≫ cost of $1–2 in API spend + 60–120s latency</text>
    <text x="20" y="142" class="body" font-size="12" fill="#1a2332">— Question warrants peer-vetted starting point, not first-pass guess</text>
  </g>

  <!-- ============================================================ -->
  <!-- TRIGGER PHRASES SIDEBAR -->
  <!-- ============================================================ -->

  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="380" height="100" fill="#faf8f3" stroke="#1a2332" stroke-width="0.5"/>
    <text x="20" y="25" class="label" font-size="10" fill="#1a2332" letter-spacing="0.15em">TRIGGER PHRASES</text>
    <line x1="20" y1="33" x2="180" y2="33" stroke="#c9a961" stroke-width="0.5"/>

    <text x="20" y="55" class="mono" font-size="11" fill="#3a6b6b">"convene the council"</text>
    <text x="20" y="72" class="mono" font-size="11" fill="#3a6b6b">"council this"</text>
    <text x="220" y="55" class="mono" font-size="11" fill="#3a6b6b">"panel this question"</text>
    <text x="220" y="72" class="mono" font-size="11" fill="#3a6b6b">"run thinking council"</text>
    <text x="20" y="89" class="body" font-size="10" fill="#1a2332" font-style="italic">case-insensitive · fuzzy match</text>
  </g>

  <!-- ============================================================ -->
  <!-- COST CONTEXT SIDEBAR -->
  <!-- ============================================================ -->

  <g transform="translate(940, 220)">
    <rect x="0" y="0" width="380" height="100" fill="#faf8f3" stroke="#1a2332" stroke-width="0.5"/>
    <text x="20" y="25" class="label" font-size="10" fill="#1a2332" letter-spacing="0.15em">COST CONTEXT</text>
    <line x1="20" y1="33" x2="160" y2="33" stroke="#c9a961" stroke-width="0.5"/>

    <text x="20" y="55" class="body" font-size="11" fill="#1a2332"><tspan font-weight="600">~10 model calls</tspan> per session</text>
    <text x="20" y="72" class="body" font-size="11" fill="#1a2332"><tspan font-weight="600">$0.50–$2.00</tspan> typical · <tspan font-weight="600">$5.00</tspan> hard cap</text>
    <text x="20" y="89" class="body" font-size="11" fill="#1a2332"><tspan font-weight="600">60–120 seconds</tspan> latency</text>
  </g>

  <!-- Bottom border -->
  <line x1="60" y1="942" x2="1340" y2="942" stroke="#c9a961" stroke-width="0.5"/>
  <line x1="60" y1="946" x2="1340" y2="946" stroke="#c9a961" stroke-width="0.5"/>

  <!-- Footer -->
  <text x="60" y="970" class="body" font-size="10" fill="#3a6b6b" font-style="italic">Manual invocation by design — Council does not auto-fire on any prompt</text>
  <text x="1340" y="970" class="label" font-size="9" fill="#3a6b6b" text-anchor="end" letter-spacing="0.15em">FIG. 2 / 2</text>
</svg>
